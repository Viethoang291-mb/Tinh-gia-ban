<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cost Cà Phê">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f5a3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Bảng Tính Giá Bán</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bitter:wght@500;700&display=swap">
<style>
/* Layout: một cột hẹp cho điện thoại; bảng cost tổng ở trên, thẻ từng sản phẩm hạt ở dưới */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --ink:#18241d; --muted:#5d6b62; --line:#d5dcd4;
  --accent:#1f5a3a; --accent-ink:#ffffff; --accent-soft:#e2ede5; --warn:#a4501a; --warn-soft:#f7e8da;
  --display:"Bitter",Georgia,serif; --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1713; --surface:#17221c; --ink:#e6eee8; --muted:#97a69c; --line:#2b3a31;
  --accent:#7cc79a; --accent-ink:#0c1a12; --accent-soft:#1d3327; --warn:#e9a368; --warn-soft:#3a2a1b; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1713; --surface:#17221c; --ink:#e6eee8; --muted:#97a69c; --line:#2b3a31;
  --accent:#7cc79a; --accent-ink:#0c1a12; --accent-soft:#1d3327; --warn:#e9a368; --warn-soft:#3a2a1b; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:24px 56px;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:18px;margin:0}
.sub,.hint{color:var(--muted);margin:0;font-size:13.5px;max-width:62ch}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.x{padding:0;width:38px;height:38px;color:var(--muted);flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{background:var(--accent-soft);border-radius:6px;padding:8px 12px;font-size:13.5px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.pad{padding:14px;display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0;height:38px}
input.num{text-align:right;font-variant-numeric:tabular-nums}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fields .wide{grid-column:1/-1}
.sec{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:130px}
tbody tr:last-child td{border-bottom:0}
td.cost{font-weight:600;color:var(--accent)}
summary{list-style:none;cursor:pointer;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
summary::-webkit-details-marker{display:none}
.s-name{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.s-meta{color:var(--muted);font-size:13px}
.s-cost{text-align:right;white-space:nowrap}
.s-cost b{display:block;font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.s-cost span{font-size:12px;color:var(--muted)}
details[open]>summary{border-bottom:1px solid var(--line)}
.erow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 38px;gap:8px;align-items:end}
dl{margin:0;display:flex;flex-direction:column}
dl div{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid var(--line)}
dl div:last-child{border-bottom:0}
dt{color:var(--muted)} dd{margin:0;font-variant-numeric:tabular-nums;text-align:right;font-weight:500}
dl .strong dt,dl .strong dd{color:var(--ink);font-weight:600}
.neg{color:var(--warn)}
@media (max-width:620px){ input,select,button{font-size:16px} }
body{padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Bảng tính cost cà phê hạt</h1>
    <p class="sub">Tính giá cốt mỗi túi từ giá hạt, hao hụt, công rang và bao bì, rồi ra giá bán theo mức lãi anh đặt.</p>
  </header>
  <div class="note" id="sampleNote">Đang hiển thị số liệu ví dụ. Bấm vào từng sản phẩm để sửa theo số của anh.</div>

  <div class="card pad">
    <h2>Bảng cost sản phẩm</h2>
    <div class="tablebox"><table>
      <thead><tr><th>Sản phẩm</th><th>Cost / túi</th><th>Cost / kg</th><th>Giá bán</th><th>Lãi / túi</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
    <div class="bar"><button type="button" class="primary" data-act="add">+ Thêm sản phẩm</button>
      <button type="button" data-act="copy">Sao chép bảng</button><span class="status" id="status" role="status"></span></div>
  </div>

  <div class="list" id="list"></div>

  <div class="card pad">
    <div class="fields"><label>Làm tròn giá bán lên<select id="rnd" data-f="set" data-k="round"></select></label></div>
    <div class="bar"><button type="button" data-act="sample">Nạp lại số liệu ví dụ</button><button type="button" data-act="blank">Xóa hết để nhập mới</button></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => isFinite(n) ? Math.round(n).toLocaleString('vi-VN') : '—';
const dong = n => isFinite(n) ? fmt(n)+' đ' : '—';
const pct = n => isFinite(n) ? (n*100).toLocaleString('vi-VN',{maximumFractionDigits:1})+'%' : '—';
const qstr = n => n ? String(n).replace('.',',') : '';
function num(s){ s=String(s).trim(); if(/^\d+\.\d{1,2}$/.test(s)) return parseFloat(s);
  const v=parseFloat(s.replace(/\./g,'').replace(',','.').replace(/[^\d.\-]/g,'')); return isFinite(v)?v:0; }

const SAMPLE = {round:1000,items:[
  {n:'Arabica Sơn La rang mộc, túi 250g',bean:150000,loss:18,roast:25000,w:250,margin:40,price:0,open:true,
    extras:[{n:'Túi zip có van một chiều',a:4500},{n:'Tem nhãn',a:800}]},
  {n:'Arabica Sơn La rang mộc, túi 500g',bean:150000,loss:18,roast:25000,w:500,margin:35,price:0,open:false,
    extras:[{n:'Túi zip có van một chiều',a:6000},{n:'Tem nhãn',a:800}]},
  {n:'Robusta nhân xanh, bao 1kg',bean:95000,loss:1,roast:0,w:1000,margin:15,price:0,open:false,
    extras:[{n:'Bao PE',a:2000}]}]};
const BLANK = {round:1000,items:[{n:'',bean:0,loss:0,roast:0,w:250,margin:30,price:0,open:true,extras:[]}]};
const KEY='tinh-gia-ban-v3';
let S, sample=true;
try{ const sv=JSON.parse(localStorage.getItem(KEY)); if(sv&&Array.isArray(sv.items)){S=sv;sample=false;} }catch(e){}
if(!S) S=JSON.parse(JSON.stringify(SAMPLE));

const roundUp = v => S.round>0 ? Math.ceil((v-1e-6)/S.round)*S.round : Math.round(v);
function calc(it){
  const keep = 1-it.loss/100;
  const perKg = keep>0 ? (it.bean+it.roast)/keep : NaN;      // giá hạt thành phẩm mỗi kg, đã tính hao hụt và công rang
  const beanCost = perKg*it.w/1000;
  const extra = it.extras.reduce((a,x)=>a+x.a,0);
  const cost = beanCost+extra;
  const sug = cost>0 ? roundUp(cost*(1+it.margin/100)) : 0;
  const price = it.price>0 ? it.price : sug;
  return {perKg,beanCost,extra,cost,costKg:it.w>0?cost/it.w*1000:NaN,sug,price,profit:price-cost,
    onCost:cost>0?(price-cost)/cost:NaN,onPrice:price>0?(price-cost)/price:NaN};
}

function render(){
  $('rnd').innerHTML=[[0,'Không làm tròn'],[500,'500 đ'],[1000,'1.000 đ'],[5000,'5.000 đ'],[10000,'10.000 đ']].map(([v,t])=>`<option value="${v}"${v==S.round?' selected':''}>${t}</option>`).join('');
  $('tbody').innerHTML=S.items.map((it,i)=>`<tr><td id="t${i}n"></td><td class="cost" id="t${i}c"></td><td id="t${i}k"></td><td id="t${i}p"></td><td id="t${i}l"></td></tr>`).join('')
    || '<tr><td colspan="5">Chưa có sản phẩm. Bấm “Thêm sản phẩm”.</td></tr>';
  $('list').innerHTML=S.items.map((it,i)=>`<details class="card" data-i="${i}"${it.open?' open':''}>
    <summary><span style="min-width:0"><span class="s-name" id="s${i}n"></span><br><span class="s-meta" id="s${i}m"></span></span>
      <span class="s-cost"><span>Cost / túi</span><b id="s${i}c"></b></span></summary>
    <div class="pad">
      <div class="fields">
        <label class="wide">Tên sản phẩm<input type="text" id="n${i}" data-f="item" data-i="${i}" data-k="n" data-t="txt" value="${esc(it.n)}"></label>
        <label>Giá hạt mua vào (đ/kg)<input class="num" inputmode="numeric" id="b${i}" data-f="item" data-i="${i}" data-k="bean" data-t="money" value="${it.bean?fmt(it.bean):''}"></label>
        <label>Hao hụt khi rang, sàng (%)<input class="num" inputmode="decimal" id="l${i}" data-f="item" data-i="${i}" data-k="loss" value="${qstr(it.loss)}"></label>
        <label>Công rang, sơ chế (đ/kg hạt mua)<input class="num" inputmode="numeric" id="r${i}" data-f="item" data-i="${i}" data-k="roast" data-t="money" value="${it.roast?fmt(it.roast):''}"></label>
        <label>Định lượng mỗi túi (g)<input class="num" inputmode="decimal" id="w${i}" data-f="item" data-i="${i}" data-k="w" value="${qstr(it.w)}"></label>
      </div>
      <div class="sec">Chi phí khác trên mỗi túi</div>
      ${it.extras.map((x,j)=>`<div class="erow">
        <label>Khoản chi<input type="text" id="en${i}_${j}" data-f="extra" data-i="${i}" data-j="${j}" data-k="n" data-t="txt" value="${esc(x.n)}"></label>
        <label>Số tiền (đ/túi)<input class="num" inputmode="numeric" id="ea${i}_${j}" data-f="extra" data-i="${i}" data-j="${j}" data-k="a" data-t="money" value="${x.a?fmt(x.a):''}"></label>
        <button type="button" class="x" aria-label="Xóa khoản chi" data-act="delExtra" data-i="${i}" data-j="${j}">✕</button></div>`).join('')}
      <div><button type="button" data-act="addExtra" data-i="${i}">+ Thêm khoản chi (bao bì, tem, vận chuyển)</button></div>
      <dl>
        <div><dt>Giá hạt thành phẩm sau hao hụt (đ/kg)</dt><dd id="d${i}perKg"></dd></div>
        <div><dt>Tiền hạt trong mỗi túi</dt><dd id="d${i}bean"></dd></div>
        <div><dt>Chi phí khác mỗi túi</dt><dd id="d${i}extra"></dd></div>
        <div class="strong"><dt>Cost mỗi túi</dt><dd id="d${i}cost"></dd></div>
        <div><dt>Cost quy ra mỗi kg thành phẩm</dt><dd id="d${i}costKg"></dd></div>
      </dl>
      <div class="sec">Giá bán</div>
      <div class="fields">
        <label>Lãi mong muốn trên cost (%)<input class="num" inputmode="decimal" id="m${i}" data-f="item" data-i="${i}" data-k="margin" value="${qstr(it.margin)}"></label>
        <label>Giá bán thực tế (đ/túi)<input class="num" inputmode="numeric" id="p${i}" data-f="item" data-i="${i}" data-k="price" data-t="money" placeholder="Để trống = giá đề xuất" value="${it.price?fmt(it.price):''}"></label>
      </div>
      <dl>
        <div><dt>Giá bán đề xuất</dt><dd id="d${i}sug"></dd></div>
        <div class="strong"><dt>Giá bán đang tính</dt><dd id="d${i}price"></dd></div>
        <div class="strong"><dt>Lãi mỗi túi</dt><dd id="d${i}profit"></dd></div>
        <div><dt>Lãi trên cost</dt><dd id="d${i}onCost"></dd></div>
        <div><dt>Lãi trên giá bán</dt><dd id="d${i}onPrice"></dd></div>
      </dl>
      <div class="bar"><button type="button" data-act="dup" data-i="${i}">Nhân bản (đổi quy cách túi)</button><button type="button" data-act="del" data-i="${i}">Xóa sản phẩm</button></div>
    </div></details>`).join('');
  refresh();
}
function refresh(){
  $('sampleNote').hidden=!sample;
  const set=(id,v,neg)=>{const e=$(id); if(e){e.textContent=v; e.classList.toggle('neg',!!neg);}};
  S.items.forEach((it,i)=>{ const r=calc(it), name=it.n||'(chưa đặt tên)', has=r.cost>0;
    set(`t${i}n`,name); set(`t${i}c`,dong(r.cost)); set(`t${i}k`,dong(r.costKg)); set(`t${i}p`,has?dong(r.price):'—'); set(`t${i}l`,has?dong(r.profit):'—',r.profit<0);
    set(`s${i}n`,name); set(`s${i}c`,dong(r.cost)); set(`s${i}m`,has?`Giá bán ${dong(r.price)} · lãi ${dong(r.profit)}`:'Nhập giá hạt để tính');
    set(`d${i}perKg`,dong(r.perKg)); set(`d${i}bean`,dong(r.beanCost)); set(`d${i}extra`,dong(r.extra));
    set(`d${i}cost`,dong(r.cost)); set(`d${i}costKg`,dong(r.costKg));
    set(`d${i}sug`,has?dong(r.sug):'—'); set(`d${i}price`,has?dong(r.price):'—'); set(`d${i}profit`,has?dong(r.profit):'—',r.profit<0);
    set(`d${i}onCost`,pct(r.onCost),r.onCost<0); set(`d${i}onPrice`,pct(r.onPrice),r.onPrice<0);
  });
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function touch(structural){ sample=false; save(); structural?render():refresh(); }

document.addEventListener('input',e=>{ const t=e.target,d=t.dataset; if(!d.f) return;
  const o = d.f==='item'?S.items[d.i] : d.f==='extra'?S.items[d.i].extras[d.j] : S;
  o[d.k] = d.t==='txt' ? t.value : (t.tagName==='SELECT' ? +t.value : Math.max(num(t.value),0));
  touch(false);
});
document.addEventListener('focusout',e=>{ const t=e.target; if(t.dataset&&t.dataset.t==='money'){ const v=num(t.value); t.value=v?fmt(v):''; } });
document.addEventListener('toggle',e=>{ const d=e.target; if(d.tagName==='DETAILS'&&S.items[d.dataset.i]){ S.items[d.dataset.i].open=d.open; save(); } },true);
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act,i=+b.dataset.i,j=+b.dataset.j;
  if(a==='sample'||a==='blank'){ S=JSON.parse(JSON.stringify(a==='sample'?SAMPLE:BLANK)); sample=a==='sample'; try{localStorage.removeItem(KEY);}catch(x){} if(!sample) save(); render(); return; }
  if(a==='copy'){ copyAll(); return; }
  if(a==='add'){ S.items.push({n:'',bean:0,loss:0,roast:0,w:250,margin:30,price:0,open:true,extras:[]}); touch(true); $('n'+(S.items.length-1)).focus(); return; }
  if(a==='dup'){ const c=JSON.parse(JSON.stringify(S.items[i])); c.n=(c.n||'Sản phẩm')+' (bản sao)'; c.open=true; S.items.splice(i+1,0,c); touch(true); $('w'+(i+1)).focus(); return; }
  if(a==='del'){ S.items.splice(i,1); touch(true); return; }
  if(a==='addExtra'){ S.items[i].extras.push({n:'',a:0}); touch(true); $(`en${i}_${S.items[i].extras.length-1}`).focus(); return; }
  if(a==='delExtra'){ S.items[i].extras.splice(j,1); touch(true); return; }
});
function copyAll(){
  const t=['BẢNG COST CÀ PHÊ HẠT','',...S.items.map(it=>{const r=calc(it);
    return `${it.n||'(chưa đặt tên)'}: cost ${dong(r.cost)}/túi (${dong(r.costKg)}/kg), giá bán ${dong(r.price)}, lãi ${dong(r.profit)} (${pct(r.onCost)} trên cost)`;})].join('\n');
  const say=m=>{const s=$('status'); s.textContent=m; setTimeout(()=>{s.textContent='';},2500);};
  const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');say('Đã sao chép');}catch(e){say('Không sao chép được');}a.remove();};
  try{navigator.clipboard.writeText(t).then(()=>say('Đã sao chép'),fb);}catch(e){fb();}
}
render();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
